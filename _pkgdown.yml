url: https://replicate-anything.github.io/replicateEverything/
template:
  bootstrap: 5
  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
      <script>mermaid.initialize({ startOnLoad: true });</script>
home:
  title: replicateEverything
  description: Discover, run, and contribute computational replications — with a bundled Shiny demo and live app at shiny2.wzb.eu/ipi/replicate/
navbar:
  structure:
    left:
    - home
    - reference
    - articles
    right: github
  components:
    articles:
      text: Articles
      menu:
      - text: All articles
        href: articles/index.html
      - text: -------
      - text: Getting going
      - text: Why replicateEverything?
        href: articles/why-replicateEverything.html
      - text: Meet the functions
        href: articles/meet-the-functions.html
      - text: Shiny demo app
        href: articles/shiny-app.html
      - text: Replication Examples Using Code
        href: articles/replication-example.html
      - text: -------
      - text: Contributing replications
      - text: Contributing principles
        href: articles/contributing-principles.html
      - text: Stata replications
        href: articles/stata-replications.html
      - text: Reanalysis and extension studies
        href: articles/reanalysis-studies.html
      - text: Folder replication checklist
        href: articles/folder-replication-checklist.html
      - text: Package replication checklist
        href: articles/package-replication-checklist.html
      - text: -------
      - text: Maintaining the registry
      - text: Maintainer setup
        href: articles/maintainer-setup.html
      - text: Registry audit
        href: articles/audit.html
